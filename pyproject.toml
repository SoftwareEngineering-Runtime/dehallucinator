[project]
name = "dehallucinator"
version = "0.1.0"
description = "Dehallucination add-on module for AI chatbots (SE mini-project, Project 39)"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs internet or the NLI model"]

[tool.coverage.run]
source = ["src"]
branch = true
